<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Anagen - Product Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: #F5F5F3;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .header {
            padding: 80px 60px 40px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            color: #0D9488;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.2s;
        }

        .badge {
            display: inline-block;
            background: #0D9488;
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: 700;
            margin-top: 30px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.4s;
        }

        .product-area {
            position: relative;
            height: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product {
            position: relative;
            z-index: 5;
        }

        .product-bottle {
            width: 400px;
            height: 600px;
            background: linear-gradient(180deg, #fff 0%, #e8e8e8 100%);
            border-radius: 30px 30px 100px 100px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(100px);
            animation: floatUp 1s ease forwards 0.6s;
        }

        .product-label {
            background: #0D9488;
            width: 320px;
            height: 200px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .product-name {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .product-type {
            font-size: 24px;
            font-weight: 500;
            opacity: 0.9;
            margin-top: 8px;
        }

        /* Floating elements */
        .floating-element {
            position: absolute;
            opacity: 0;
            animation: floatElement 4s ease-in-out infinite;
        }

        .element-1 {
            top: 150px;
            left: 100px;
            animation-delay: 1.2s;
        }

        .element-2 {
            top: 200px;
            right: 80px;
            animation-delay: 1.4s;
        }

        .element-3 {
            bottom: 250px;
            left: 120px;
            animation-delay: 1.6s;
        }

        .element-4 {
            bottom: 200px;
            right: 100px;
            animation-delay: 1.8s;
        }

        .element-5 {
            top: 400px;
            left: 60px;
            animation-delay: 2s;
        }

        .element-6 {
            top: 350px;
            right: 50px;
            animation-delay: 2.2s;
        }

        .float-card {
            background: white;
            padding: 25px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .float-icon {
            font-size: 36px;
        }

        .features {
            padding: 60px 80px;
            position: relative;
            z-index: 10;
        }

        .feature-row {
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }

        .feature {
            flex: 1;
            background: white;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            opacity: 0;
            transform: translateY(30px);
        }

        .feature:nth-child(1) { animation: fadeUp 0.6s ease forwards 2s; }
        .feature:nth-child(2) { animation: fadeUp 0.6s ease forwards 2.2s; }
        .feature:nth-child(3) { animation: fadeUp 0.6s ease forwards 2.4s; }

        .feature-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .feature-text {
            font-size: 26px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .price-tag {
            text-align: center;
            padding: 50px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 2.6s;
        }

        .price {
            font-size: 80px;
            font-weight: 900;
            color: #1a1a1a;
        }

        .price span {
            font-size: 40px;
            color: #666;
        }

        .price-sub {
            font-size: 32px;
            color: #666;
            margin-top: 10px;
        }

        /* Background decorations */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #0D9488 0%, #14b8a6 100%);
            opacity: 0.08;
        }

        .bg-circle-1 {
            width: 600px;
            height: 600px;
            top: 300px;
            left: -200px;
            animation: pulse 8s ease-in-out infinite;
        }

        .bg-circle-2 {
            width: 500px;
            height: 500px;
            top: 600px;
            right: -150px;
            animation: pulse 10s ease-in-out infinite reverse;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes floatUp {
            from {
                opacity: 0;
                transform: translateY(100px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatElement {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            20% {
                opacity: 1;
            }
            50% {
                transform: translateY(-10px);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: translateY(20px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>

    <div class="header">
        <div class="logo">ANAGEN</div>
        <div class="badge">New Formula</div>
    </div>

    <div class="product-area">
        <div class="floating-element element-1">
            <div class="float-card">
                <span class="float-icon">🧬</span>
                DHT Blocker
            </div>
        </div>
        <div class="floating-element element-2">
            <div class="float-card">
                <span class="float-icon">🌿</span>
                Natural
            </div>
        </div>
        <div class="floating-element element-3">
            <div class="float-card">
                <span class="float-icon">⚡</span>
                Fast Acting
            </div>
        </div>
        <div class="floating-element element-4">
            <div class="float-card">
                <span class="float-icon">✨</span>
                Clinically Tested
            </div>
        </div>
        <div class="floating-element element-5">
            <div class="float-card">
                <span class="float-icon">💪</span>
                Minoxidil 5%
            </div>
        </div>
        <div class="floating-element element-6">
            <div class="float-card">
                <span class="float-icon">🎯</span>
                Targeted
            </div>
        </div>

        <div class="product">
            <div class="product-bottle">
                <div class="product-label">
                    <div class="product-name">ANAGEN</div>
                    <div class="product-type">Hair Serum</div>
                </div>
            </div>
        </div>
    </div>

    <div class="features">
        <div class="feature-row">
            <div class="feature">
                <div class="feature-icon">🔬</div>
                <div class="feature-text">Lab Tested</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🌱</div>
                <div class="feature-text">Vegan</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🇺🇸</div>
                <div class="feature-text">Made in USA</div>
            </div>
        </div>
    </div>

    <div class="price-tag">
        <div class="price">$49<span>/mo</span></div>
        <div class="price-sub">Free shipping • Cancel anytime</div>
    </div>
</body>
</html>
